[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-rag-backend"
version = "0.1.0"
description = "Resume RAG + HR search API (hybrid retrieval over pgvector)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"          # async test functions need no @pytest.mark
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requires a live Postgres + pgvector database",
    "llm_live: makes a real (billed, rate-limited) LLM API call",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]              # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use fixtures with leading underscores and long strings.
"tests/*" = ["E501"]