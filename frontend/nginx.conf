# Serves the React build and proxies the API, so the browser only ever talks to
# one origin. That is the production equivalent of Vite's dev proxy, and it is
# why no CORS configuration is needed in production.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router owns /candidates/... etc., so unknown paths must
    # return index.html instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Uploads can be slow; do not let nginx cut them off.
        client_max_body_size 25m;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
    }

    # Hashed asset filenames from Vite are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}